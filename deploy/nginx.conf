# Шаблон reverse proxy для публичного запуска elmira-site.
#
# Что делает:
#   - принимает HTTPS-трафик с домена и проксирует на локальный Node (127.0.0.1:8765);
#   - сам ставит X-Forwarded-For / X-Real-IP (перезаписывает, а не дописывает —
#     клиент не может подделать заголовок и обойти rate-limit приложения);
#   - держит ОБЩИЙ rate-limit на /api/, который страхует встроенный лимит
#     приложения: тот считает только успешные заказы, а этот режет любой
#     шквал запросов (в т.ч. невалидных) с одного IP.
#
# Установка (Debian/Ubuntu):
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/elmira-site
#   sudo ln -s /etc/nginx/sites-available/elmira-site /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d example.com     # получит TLS и допишет 443-блок
#   sudo nginx -t && sudo systemctl reload nginx
#
# После этого в .env сайта: BIND_HOST=127.0.0.1 (или в Docker — порт публикуется
# только на 127.0.0.1, см. docker-compose.yml), TRUST_PROXY=1.
#
# Замените example.com на свой домен.

limit_req_zone $binary_remote_addr zone=elmira_api:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    client_max_body_size 8m;

    location /api/ {
        limit_req zone=elmira_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
